server:
  port: 8080

spring:
  application:
    name: backend-doctor-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/backend_doctor
    username: backend_doctor
    password: backend_doctor
    hikari:
      # Intentionally small pool for now -- this is one of the things
      # we'll stress-test later (thread pool vs connection pool, Phase 3).
      maximum-pool-size: 20

  jpa:
    # Fix #004, part 2: without this, Spring keeps a Hibernate session (and
    # its DB connection) bound to the request thread for the ENTIRE HTTP
    # request -- not just inside @Transactional -- so splitting a method
    # into short transactions doesn't actually release the connection any
    # sooner if open-in-view is still on. See docs/audit/004-long-transaction.md.
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate
    properties:
      hibernate:
        format_sql: true
        # Turned on deliberately during Phase 2 so N+1 queries show up
        # clearly in the console. Turn off once you've seen enough.
        generate_statistics: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: backend-doctor-demo
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "uz.backenddoctor.order.event"

management:
  # Fix #008 -- a separate port means actuator gets its own embedded
  # Tomcat connector with its own thread pool, independent of the main
  # application's (server.port above). A burst that exhausts the main
  # pool waiting on the (much smaller) Hikari pool can no longer take
  # /actuator/health down with it. See docs/audit/008-pool-mismatch.md.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus

# Controls how much fake data the seeder inserts on startup.
# Start small locally; scale up once you're ready to demonstrate
# performance at "production-like" volume.
seed:
  enabled: true
  customers: 5000
  products: 2000
  orders: 20000
  max-items-per-order: 5
