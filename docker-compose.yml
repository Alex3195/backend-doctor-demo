services:
  postgres:
    image: postgres:16
    container_name: backend-doctor-postgres
    environment:
      POSTGRES_DB: backend_doctor
      POSTGRES_USER: backend_doctor
      POSTGRES_PASSWORD: backend_doctor
    ports:
      - "5432:5432"
    volumes:
      - backend_doctor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_doctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Wired in for Phase 4 caching -- see Issue #006.
  redis:
    image: redis:7
    container_name: backend-doctor-redis
    ports:
      - "6379:6379"

  # Wired in for Phase 4 async processing -- see Issue #007. Single-node,
  # KRaft mode (no Zookeeper needed).
  kafka:
    image: apache/kafka:3.7.0
    container_name: backend-doctor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # Wired in for Phase 5 metrics -- see docs/audit/000-overview.md.
  # Scrapes the app's /actuator/prometheus (port 8081, see Issue #008).
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: backend-doctor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # host.docker.internal works out of the box on Docker Desktop
      # (Mac/Windows); this line makes it resolve on Linux too.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: backend-doctor-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    depends_on:
      - prometheus

volumes:
  backend_doctor_pg_data:
