services:
  postgres:
    image: postgres:16
    container_name: backend-doctor-postgres
    environment:
      POSTGRES_DB: backend_doctor
      POSTGRES_USER: backend_doctor
      POSTGRES_PASSWORD: backend_doctor
    ports:
      - "5432:5432"
    volumes:
      - backend_doctor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_doctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Wired in for Phase 4 caching -- see Issue #006.
  redis:
    image: redis:7
    container_name: backend-doctor-redis
    ports:
      - "6379:6379"

  # Wired in for Phase 4 async processing -- see Issue #007. Single-node,
  # KRaft mode (no Zookeeper needed).
  kafka:
    image: apache/kafka:3.7.0
    container_name: backend-doctor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

volumes:
  backend_doctor_pg_data:
