global:
  scrape_interval: 5s

scrape_configs:
  - job_name: backend-doctor-demo
    metrics_path: /actuator/prometheus
    static_configs:
      # The app runs on the host (gradlew bootRun), not in this compose
      # network -- host.docker.internal resolves to the host machine on
      # Docker Desktop (Mac/Windows). On Linux, add
      # "extra_hosts: [host.docker.internal:host-gateway]" to this
      # service in docker-compose.yml instead.
      - targets: ["host.docker.internal:8081"]
